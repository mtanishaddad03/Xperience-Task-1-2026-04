spring:
  application:
    name: hero

  datasource:
    url: jdbc:postgresql://localhost:5432/hero
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: hero
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8280
