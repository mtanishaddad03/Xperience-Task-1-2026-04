spring:
  application:
    name: hero

  datasource:
    # currentSchema must name the same schema as hibernate.default_schema below: JPA uses that setting, while
    # plain JDBC (the drain's control row, the clock) follows the connection's search path.
    url: jdbc:postgresql://localhost:5432/hero?currentSchema=hero
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: hero
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

hero:
  # Where the links in messages point: the page URL is the credential, so this is the frontend, not the API.
  public-base-url: http://localhost:5171

  drain:
    enabled: true
    interval: 2s
    batch-size: 10
    send-timeout: 10s
    # Must be longer than send-timeout, or a message still being sent would be reclaimed and sent twice.
    reclaim-after: 1m
    # D15: three retries after the first attempt, then final failed.
    retry-delays: 1m,5m,15m
    send-threads: 4

  limits:
    # D14, counted per address over a rolling 24 hours.
    invitations-per-host-per-day: 1000
    management-links-per-address-per-day: 5

server:
  port: 8280
